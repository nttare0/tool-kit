openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: Tool discovery and management
  - name: categories
    description: Tool category management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List tools
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
    post:
      operationId: createTool
      tags: [tools]
      summary: Create a tool
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInput"
      responses:
        "201":
          description: Created tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
  /tools/{id}:
    get:
      operationId: getTool
      tags: [tools]
      summary: Get a tool by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Tool not found
    patch:
      operationId: updateTool
      tags: [tools]
      summary: Update a tool
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpdate"
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Tool not found
    delete:
      operationId: deleteTool
      tags: [tools]
      summary: Delete a tool
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Tool deleted
        "404":
          description: Tool not found
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Category deleted
        "404":
          description: Category not found
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register a public member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRegistration"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResponse"
  /auth/user/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Sign in a public member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLogin"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResponse"
  /auth/user/status:
    get:
      operationId: getUserSession
      tags: [auth]
      summary: Get the current member session
      responses:
        "200":
          description: Current member, or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatusResponse"
  /auth/user/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Sign out a public member
      responses:
        "204":
          description: Signed out
  /account/profile:
    get:
      operationId: getAccountProfile
      tags: [account]
      summary: Get the signed-in member profile and interests
      security: [{ userSession: [] }]
      responses:
        "200":
          description: Member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
    patch:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update member profile and category interests
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
  /account/password:
    post:
      operationId: changeAccountPassword
      tags: [account]
      summary: Change the signed-in member password
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
  /account/submissions:
    get:
      operationId: listOwnSubmissions
      tags: [submissions]
      summary: List the signed-in member's tool submissions
      security: [{ userSession: [] }]
      responses:
        "200":
          description: The member's submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionListItem"
  /account/favorites:
    get:
      operationId: listFavoriteTools
      tags: [account]
      summary: List tools saved by the signed-in member
      security: [{ userSession: [] }]
      responses:
        "200":
          description: Saved tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
  /account/favorites/{toolId}:
    put:
      operationId: saveFavoriteTool
      tags: [account]
      summary: Save a published tool to member favorites
      security: [{ userSession: [] }]
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tool saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
    delete:
      operationId: removeFavoriteTool
      tags: [account]
      summary: Remove a tool from member favorites
      security: [{ userSession: [] }]
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Favorite removed
  /account/collections:
    get:
      operationId: listCollections
      tags: [account]
      summary: List member tool collections
      security: [{ userSession: [] }]
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolCollection"
    post:
      operationId: createCollection
      tags: [account]
      summary: Create a personal tool collection
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolCollectionInput"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCollection"
  /account/collections/{id}:
    get:
      operationId: getCollection
      tags: [account]
      summary: Get a personal tool collection and its tools
      security: [{ userSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCollectionDetail"
    patch:
      operationId: updateCollection
      tags: [account]
      summary: Update a personal tool collection
      security: [{ userSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolCollectionInput"
      responses:
        "200":
          description: Collection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCollection"
    delete:
      operationId: deleteCollection
      tags: [account]
      summary: Delete a personal tool collection
      security: [{ userSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Collection deleted
  /account/collections/{id}/tools/{toolId}:
    put:
      operationId: addToolToCollection
      tags: [account]
      summary: Add a published tool to a personal collection
      security: [{ userSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: toolId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tool added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
    delete:
      operationId: removeToolFromCollection
      tags: [account]
      summary: Remove a tool from a personal collection
      security: [{ userSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: toolId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Tool removed
  /submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a tool for admin review
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListItem"
  /admin/submissions:
    get:
      operationId: listAdminSubmissions
      tags: [admin]
      summary: List all member tool submissions
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Submissions for admin review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSubmission"
  /admin/submissions/{id}:
    patch:
      operationId: reviewSubmission
      tags: [admin]
      summary: Approve and publish, or reject a submission
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionReview"
      responses:
        "200":
          description: Review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReviewResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List member accounts and submission counts
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Member accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
  /admin/users/{id}:
    patch:
      operationId: updateManagedUser
      tags: [admin]
      summary: Suspend or restore a member account
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserStatus"
      responses:
        "200":
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUserStatusResponse"
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [admin]
      summary: List recent user and admin activity
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /admin/password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the signed-in admin password
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
  /admin/llm-providers:
    get:
      operationId: listLlmProviders
      tags: [admin]
      summary: List configured LLM provider metadata and key status
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Provider details without secret values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmProvider"
    post:
      operationId: createLlmProvider
      tags: [admin]
      summary: Add an LLM provider with an encrypted API key
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmProviderInput"
      responses:
        "201":
          description: Provider configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProvider"
  /admin/llm-providers/{id}:
    patch:
      operationId: updateLlmProviderKey
      tags: [admin]
      summary: Edit provider settings or replace its API key
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmProviderKeyInput"
      responses:
        "200":
          description: Provider settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProvider"
        "404":
          description: Provider not found
    delete:
      operationId: deleteLlmProvider
      tags: [admin]
      summary: Remove an LLM provider configuration
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Provider configuration removed
  /admin/llm-providers/{id}/models:
    get:
      operationId: discoverLlmProviderModels
      tags: [admin]
      summary: List models from the configured provider without exposing its key
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available model IDs; some providers require manual model entry
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: { type: string }
  /admin/llm-providers/{id}/test:
    post:
      operationId: testLlmProviderConnection
      tags: [admin]
      summary: Send a small billable generation request to test this connection
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provider returned nonempty text
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
  /ai/chat:
    post:
      operationId: chatWithToolstackAssistant
      tags: [ai]
      summary: Chat with an admin assistant that can draft tool listings
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: Assistant response and optional tool draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
  /ai/suggest-tool:
    post:
      operationId: suggestToolDetails
      tags: [ai]
      summary: Draft tool listing details and category suggestions
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestionInput"
      responses:
        "200":
          description: Suggested listing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestion"
  /tools/{slug}/related:
    get:
      operationId: listRelatedTools
      tags: [tools]
      summary: Suggest tools with similar use cases and workflows
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Related tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedTool"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: toolstack_session
    userSession:
      type: apiKey
      in: cookie
      name: toolstack_user_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, description, toolCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        accent: { type: string }
        toolCount: { type: integer }
    CategoryInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        accent: { type: string }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        accent: { type: string }
    Tool:
      type: object
      required: [id, name, slug, shortDescription, description, howItWorks, websiteUrl, categoryId, categoryName, pricing, featured, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        howItWorks: { type: string }
        bestFor: { type: string }
        websiteUrl: { type: string, format: uri }
        logoUrl: { type: ["string", "null"], format: uri }
        previewUrl: { type: ["string", "null"] }
        categoryId: { type: integer }
        categoryName: { type: string }
        categorySlug: { type: string }
        pricing: { type: string }
        featured: { type: boolean }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    ToolInput:
      type: object
      required: [name, shortDescription, description, howItWorks, websiteUrl, categoryId, pricing]
      properties:
        name: { type: string, minLength: 1 }
        shortDescription: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        howItWorks: { type: string, minLength: 1 }
        bestFor: { type: string }
        websiteUrl: { type: string, format: uri }
        logoUrl: { type: ["string", "null"], format: uri }
        previewUrl: { type: ["string", "null"] }
        categoryId: { type: integer }
        pricing: { type: string, minLength: 1 }
        featured: { type: boolean }
        status: { type: string }
    ToolUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        shortDescription: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        howItWorks: { type: string, minLength: 1 }
        bestFor: { type: string }
        websiteUrl: { type: string, format: uri }
        logoUrl: { type: ["string", "null"], format: uri }
        previewUrl: { type: ["string", "null"] }
        categoryId: { type: integer }
        pricing: { type: string, minLength: 1 }
        featured: { type: boolean }
        status: { type: string }
    AccountRegistration:
      type: object
      required: [displayName, email, password]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        profession: { type: string, maxLength: 100 }
    AccountLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      required: [id, email, displayName, profession]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        displayName: { type: string }
        profession: { type: string }
    UserAuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    UserStatusResponse:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    AccountProfile:
      type: object
      required: [user, categoryIds]
      properties:
        user: { $ref: "#/components/schemas/User" }
        categoryIds:
          type: array
          items: { type: integer }
    AccountProfileUpdate:
      type: object
      required: [displayName, profession, categoryIds]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        profession: { type: string, maxLength: 100 }
        categoryIds:
          type: array
          maxItems: 12
          items: { type: integer }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
    PasswordChangeResponse:
      type: object
      required: [changed]
      properties:
        changed: { type: boolean }
    SubmissionInput:
      type: object
      required: [name, websiteUrl, shortDescription, description, howItWorks, pricing]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        websiteUrl: { type: string, format: uri }
        shortDescription: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, minLength: 1 }
        howItWorks: { type: string, minLength: 1 }
        bestFor: { type: string }
        pricing: { type: string, minLength: 1, maxLength: 100 }
        logoUrl: { type: ["string", "null"] }
    SubmissionListItem:
      type: object
      required: [id, name, websiteUrl, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        websiteUrl: { type: string, format: uri }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
